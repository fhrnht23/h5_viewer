[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "h5viewer"
version = "0.1.1"
description = "Cross-platform, two-pane HDF5 viewer and editor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "H5 Viewer contributors" }]
dependencies = [
    # 6.11.1 не обнаруживает platform plugins в проверенной среде macOS/Python 3.10.
    "PySide6>=6.10.3,<6.11",
    "h5py>=3.11,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
plots = ["pyqtgraph>=0.13.7,<1"]
packaging = [
    "build>=1.2,<2",
    "pyinstaller>=6.20,<7",
    "pyqtgraph>=0.13.7,<1",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
]

[project.scripts]
h5viewer = "h5viewer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/h5viewer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N802", "UP", "B", "SIM", "RUF"]
# Кириллические строки и docstrings являются осознанным требованием проекта.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
packages = ["h5viewer"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["h5py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["h5viewer.presentation.qt.models"]
# Типы PySide6 не могут одновременно выразить QObject.parent() и QAbstractItemModel.parent(index).
disable_error_code = ["override"]
