name: Проверки и сборка

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Установить системные библиотеки Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Установить проект
        run: python -m pip install -e ".[dev]"
      - name: Проверить стиль
        run: python -m ruff check .
      - name: Проверить форматирование
        run: python -m ruff format --check .
      - name: Проверить типы
        run: python -m mypy src/h5viewer
      - name: Запустить тесты
        run: python -m pytest

  python-package:
    name: Python wheel и sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить сборщик
        run: python -m pip install build
      - name: Собрать Python-пакеты
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: h5viewer-python-package
          path: |
            dist/*.whl
            dist/*.tar.gz

  desktop-package:
    name: Desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости упаковки
        run: python -m pip install -e ".[packaging]"
      - name: Собрать нативное приложение
        run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: h5viewer-${{ runner.os }}-${{ runner.arch }}
          path: dist/H5Viewer*
